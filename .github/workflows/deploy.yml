name: Deploy

# main への push のみでデプロイする(pull_request では絶対に動かさない)
on:
  push:
    branches: [main]

permissions:
  contents: read

# main への連続 push でデプロイが競合しないよう直列化する
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ローカル(mise)と CI で Node のバージョンがずれないよう mise.toml から読み取る
      - id: node
        run: echo "version=$(sed -n 's/^node = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - run: npm ci

      # デプロイ対象の dist/ をここで作る。失敗すればデプロイには進まない
      - run: make build

      # wrangler は devDependencies に固定してあるので wranglerVersion は指定しない
      # (未指定かつインストール済みの場合、action はその wrangler を使う)
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
