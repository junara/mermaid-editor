name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ローカル(mise)と CI で Node のバージョンがずれないよう mise.toml から読み取る
      - id: node
        run: echo "version=$(sed -n 's/^node = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - run: npm ci

      # フォーマット確認 + lint + 型チェック + テスト(pre-commit フックと同じ内容)
      - run: make check
