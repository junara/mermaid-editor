<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mermaid エディタ</title>
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <div class="toolbar-group">
          <button id="export-svg" type="button">SVG 出力</button>
          <button id="export-png" type="button">PNG 出力</button>
        </div>

        <div class="toolbar-group">
          <label for="png-scale">スケール</label>
          <select id="png-scale">
            <option value="1">1x</option>
            <option value="2" selected>2x</option>
            <option value="3">3x</option>
          </select>
        </div>

        <div class="toolbar-group">
          <label for="png-background">背景</label>
          <select id="png-background">
            <option value="transparent" selected>透過</option>
            <option value="white">白</option>
          </select>
        </div>

        <div class="toolbar-group toolbar-group--right">
          <button id="zoom-out" type="button" title="縮小">−</button>
          <button id="zoom-reset" type="button" title="100% に戻す">
            <span id="zoom-value">100%</span>
          </button>
          <button id="zoom-in" type="button" title="拡大">＋</button>
        </div>
      </header>

      <main class="panes" id="panes">
        <section class="pane pane--editor" id="editor-pane" aria-label="エディタ"></section>
        <div
          class="splitter"
          id="splitter"
          role="separator"
          aria-orientation="vertical"
          aria-label="エディタとプレビューの分割比率"
          aria-controls="editor-pane"
          tabindex="0"
        ></div>
        <section class="pane pane--preview" id="preview-pane" aria-label="プレビュー">
          <div class="preview-stage" id="preview-stage"></div>
        </section>
      </main>

      <footer class="statusbar">
        <span class="status-error" id="status-error" role="status"></span>
        <span class="status-save" id="status-save"></span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
